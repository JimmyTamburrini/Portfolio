<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#05070d" />
    <meta
      name="description"
      content="Jimmy Tamburrini — mechanical engineer, developer, and creative technologist."
    />
    <title>Jimmy Tamburrini — Engineer & Creative Technologist</title>
  </head>
  <body style="margin: 0; background: #05070d; color: #edf3ff">
    <div id="root">
      <!-- Visible immediately and retained if JavaScript or WebGL cannot initialize. -->
      <main
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: radial-gradient(circle, #142551 0, #080c17 35%, #05070d 70%);
          font-family: system-ui, sans-serif;
        "
      >
        <div style="text-align: center">
          <div
            style="
              width: 96px;
              height: 96px;
              margin: 0 auto 28px;
              border: 1px solid #50dfff;
              border-radius: 50%;
              box-shadow:
                0 0 60px #784bff66,
                inset 0 0 35px #50dfff55;
            "
          ></div>
          <p style="margin: 0 0 10px; font-size: 12px; letter-spacing: 0.2em; color: #50dfff">
            JIMMY TAMBURRINI
          </p>
          <p style="margin: 0; font-size: 14px; color: #93a0b8">Initializing portfolio…</p>
          <noscript>
            <p style="max-width: 420px; line-height: 1.6; color: #c4cede">
              This interactive portfolio requires JavaScript. Please enable it to explore the work.
            </p>
          </noscript>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
